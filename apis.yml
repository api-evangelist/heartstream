name: Heartstream
description: Heartstream is an emergency-care and defibrillation brand, now part of
  Philips, that makes automated external defibrillators (AEDs) and professional monitor/defibrillators
  for public-access, home, and EMS use. The company originated as a Mayfield-backed
  medical-device startup that pioneered automatic external defibrillators and was later
  acquired by Hewlett-Packard; today the Heartstream name lives on across the HeartStart
  AED and Tempus ALS product lines sold in more than 50 countries and regions. Its public
  site publishes product support, a document center (instructions for use), and a newsroom,
  but it exposes no public developer portal, API, or documentation surface, so there are
  no API artifacts to enrich.
